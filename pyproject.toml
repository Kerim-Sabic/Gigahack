[project]
name = "secure-mom"
version = "0.1.0"
requires-python = ">=3.11,<3.13"
dependencies = ["fastapi", "uvicorn", "sqlalchemy", "alembic", "argon2-cffi", "python-multipart", "httpx", "psutil", "filelock", "jinja2", "pydantic-settings"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
