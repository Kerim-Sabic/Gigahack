# Developer-controlled local runtime. Effective values are frozen in every new job.
# Bigger context/model/batches require a fresh memory and accuracy qualification.
schema_version = 1

[llm]
model_directory = "qwen" # Must name prepared, manifest-verified local assets.
model_file = "Qwen3.5-4B-Q4_K_M.gguf"
context_tokens = 4096
source_window_tokens = 1800
reconciliation_tokens = 1800
extraction_tokens = 768
classification_tokens = 256
category_tokens = 32
field_tokens = 400
reasoning_tokens = 768 # Interpretation only; zero disables thinking.
reasoning_overhead_tokens = 32
temperature = 0.0
batch_size = 256
micro_batch_size = 128
gpu_layers = -1 # All layers; CPU profile still overrides to zero.
request_timeout_seconds = 180
startup_timeout_seconds = 180
split_depth = 8

[asr]
model_directory = "whisper"
checkpoint_seconds = 300 # Bound decoded audio memory and persist completed chunks.
overlap_seconds = 2 # Context around chunk boundaries; canonical word offsets select ownership.
beam_size = 5
decode_window_seconds = 25
retry_window_seconds = 15
condition_on_previous_text = false
multilingual = true # Detect language for each decoding window; never translate.
vad_filter = true
gpu_compute_type = "int8_float16"
cpu_compute_type = "int8"

[optional]
diarization_engine = "community1" # nemotron3 is available for qualification; requires its separate prepared runtime.
runtime_prefix = "" # Prepared Linux/WSL environment; MOM_OPTIONAL_RUNTIME may override this at queue time.
parakeet_audio_fraction = 1.0 # Compare every transcript segment when the optional check is selected.
parakeet_batch_size = 1
diarization_batch_size = 16
recovery_window_seconds = 20 # Suspected speech gaps; preserve hypotheses separately for review.
recovery_retry_seconds = 10 # One shorter pass only when a longer window returns no text.
recovery_padding_seconds = 2 # Context around each gap; total clip stays at most 25 seconds.

# Experimental explicit-window benchmark stage; not yet selected by normal jobs.
[qwen_asr]
backend = "native" # official uses the publisher implementation in a separate, registered runtime.
runtime_prefix = "" # Absolute Linux/WSL path for the official runtime; never downloads at inference time.
max_new_tokens = 1024 # Cap exhaustion fails explicitly; never publish truncated speech.
context_characters = 1024 # Session-provided spelling hints only; no generated facts.
attention = "sdpa"
precision = "bfloat16" # Float32/eager available for numerical diagnostics; qualify VRAM separately.

[nemotron]
runtime_prefix = "" # Absolute Linux/WSL path to the registered Nemotron runtime.
mode = "offline_context" # Other modes require separate latency/accuracy qualification.
threshold = 0.5 # Speaker activity threshold; changing this changes overlap/turn boundaries.

[vibevoice]
runtime_prefix = "" # Experimental offline benchmark only; separate registered Linux runtime.
max_new_tokens = 2048 # Truncated/invalid structured output fails explicitly.
context_characters = 1024
seed = 42 # Upstream audio latent sampling; recorded for reproducibility.

# Generation slots and GPU admission remain fixed at one. This is a safety invariant,
# not an unqualified performance knob. No runtime setting enables network inference.

[worker]
no_activity_timeout_seconds = 1800 # No fixed total duration cutoff; stop only after sustained inactivity.
